model: "mlx-community/Qwen2.5-3B-Instruct-8bit"
data: "./data"
train: true
adapter_path: "./adapters"

iters: 800
batch_size: 2
learning_rate: 3e-6
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments:
    - 3e-6
    - 800
grad_checkpoint: true

steps_per_report: 10
steps_per_eval: 50
val_batches: 25
save_every: 100

max_seq_length: 1024
mask_prompt: true
num_layers: 8

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.v_proj"
    - "self_attn.k_proj"
    - "self_attn.o_proj"
  rank: 8
  scale: 20.0
  dropout: 0.05
